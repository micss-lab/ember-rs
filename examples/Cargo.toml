[package]
name = "ember-examples"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.22"
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }

[target.'cfg(not(target_os = "none"))'.dependencies]
ember = { workspace = true, features = ["acc-http", "agent-bdi", "agent-reactive"] }

env_logger = "0.11.8"
critical-section = { version = "1.2.0", features = ["std"] }

[target.'cfg(target_os = "none")'.dependencies]
ember = { workspace = true, features = ["acc-espnow", "agent-bdi", "agent-reactive"] }
ember-time = { path = "../ember-time", features = ["esp32"] }

esp-alloc = { workspace = true }
esp-println = { workspace = true, features = ["esp32", "log-04"] }
esp-backtrace = { workspace = true, features = [
    "esp32",
    "println",
    "panic-handler",
] }
esp-hal = { workspace = true, default-features = true, features = ["esp32", "unstable"] }
esp-radio = { workspace = true, features = ["esp32", "wifi", "esp-now", "unstable"] }
esp-rtos = { workspace = true, features = ["esp32", "esp-radio"] }
# esp-hal itself doesn't forward this feature, so it has to be forced on
# directly here for `#[ram(reclaimed)]` (see esp.rs) to compile.
esp-hal-procmacros = { version = "0.22.0", features = ["__esp_idf_bootloader"] }
