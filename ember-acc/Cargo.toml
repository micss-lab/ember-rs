[package]
name = "ember-acc"
version = "0.1.0"
edition = "2024"

[dependencies]
ember-core = { workspace = true }
ember-time = { workspace = true, optional = true }
ember-collections = { workspace = true, optional = true }

cfg-if = "1.0"
log = "0.4"
derive_more = { version = "2.1", default-features = false, features = ["error", "display"] }

bstr = { version = "1.12", default-features = false, features = ["alloc", "serde"], optional = true }
bytes = { version = "1.10", default-features = false, features = ["serde"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"], optional = true }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"], optional = true }
hex = { version = "0.4", default-features = false, features = ["alloc"], optional = true }

multipart = { git = "https://github.com/exellentcoin26/multipart-rs.git", features = ["server", "tiny_http"], optional = true }
rand = { version = "0.9", optional = true }
tiny_http = { version = "0.12", optional = true }
ureq = { version = "3.0", default-features = false, optional = true }
serde_bencode = { version = "0.2", optional = true }

esp-hal = { workspace = true, features = ["unstable"], optional = true }
esp-radio = { workspace = true, features = ["esp32", "wifi", "esp-now", "unstable"], optional = true }
macaddr = { version = "1.0", default-features = false, features = ["serde"], optional = true }
postcard = { version = "1.1", default-features = false, features = ["alloc"], optional = true }

[features]
std = []
http = [
    "std",
    "serde-http",

    "dep:bstr",
    "dep:bytes",
    "dep:hex",
    "dep:multipart",
    "dep:rand",
    "dep:serde_bencode",
    "dep:tiny_http",
    "dep:ureq",
]
espnow = [
    "serde-espnow",

    "dep:esp-hal",
    "dep:esp-radio",
    "dep:postcard",
    "dep:ember-time",
    "dep:ember-collections",
    "ember-time/esp32",
]
custom = []
serde-http = [
    "dep:chrono",
    "dep:serde",
]
serde-espnow = [
    "dep:chrono",
    "dep:macaddr",
    "dep:serde",
]
# esp-hal has an open issue that they require the rt feature to build a library
# for the esp-now channel. This is the only reason this feature exists.
rt = ["esp-hal/rt"]

[lints.clippy]
uninlined_format_args = { level = "allow" }
